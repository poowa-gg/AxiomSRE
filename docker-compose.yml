version: '3.8'

services:
  axiomsre:
    build: .
    container_name: axiomsre_commander
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - NEBIUS_BASE_URL=https://api.tokenfactory.nebius.com/v1/
      - NEBIUS_API_KEY=${NEBIUS_API_KEY:-}
      - NVIDIA_FAST_MODEL=nvidia/nemotron-3-super-120b-a12b
      - NVIDIA_REASONING_MODEL=nvidia/Nemotron-3-Ultra-550b-a55b
      - NVIDIA_CODE_MODEL=nvidia/nemotron-3-super-120b-a12b
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - DEMO_MODE=true
    restart: unless-stopped
